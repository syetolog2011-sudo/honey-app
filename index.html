<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini App</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #334155 0%, #0f172a 100%);
            background-attachment: fixed; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; -webkit-user-select: none; min-height: 100vh;
            position: relative; overflow-x: hidden;
        }
        .keys-container { display: flex; justify-content: center; gap: 6px; margin-top: 25px; margin-bottom: 25px; width: 98%; }
        .key-slot {
            position: relative; width: 90px; height: 90px; background: rgba(255, 255, 255, 0.1);
            border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2); box-sizing: border-box;
        }
        .key-slot img { width: 50px; height: 50px; object-fit: contain; display: block; margin-bottom: 12px; }
        .key-count { position: absolute; bottom: 6px; left: 8px; font-size: 13px; font-weight: bold; background: rgba(0, 0, 0, 0.6); padding: 2px 6px; border-radius: 5px; }
        .balance-container { display: flex; align-items: center; gap: 15px; margin-bottom: 35px; }
        .balance-number { font-size: 28px; font-weight: 900; }
        .honey-icon { width: 32px; height: 32px; }

        .screen { display: none; flex-direction: column; align-items: center; width: 100%; position: relative; }
        .active-screen { display: flex !important; }

        .buttons-list { display: flex; flex-direction: column; align-items: center; gap: 36px; width: 100%; }
        .menu-btn { background: none; border: none; padding: 0; cursor: pointer; width: 92%; max-width: 360px; transition: transform 0.1s ease; -webkit-tap-highlight-color: transparent; }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn img { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4)); }

        .banks-list, .cases-list, .games-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; width: 95%; max-width: 380px; margin-top: 20px; }
        .back-arrow-btn { position: absolute; top: -20px; right: 15px; width: 36px; height: 36px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #ffffff; cursor: pointer; z-index: 100; -webkit-tap-highlight-color: transparent; }
        
        .bank-card, .case-card, .game-card { width: calc(50% - 7px); aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); cursor: pointer; transition: transform 0.1s ease; -webkit-tap-highlight-color: transparent; }
        .bank-card:active, .case-card:active, .game-card:active { background: rgba(255, 255, 255, 0.15); transform: scale(0.96); }
        .bank-img, .case-img, .game-img { width: 95px; height: 95px; object-fit: contain; display: block; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }

        /* РУЛЕТКА */
        .roulette-container-horizontal { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; padding: 0 10px; box-sizing: border-box; }
        .slots-lines-holder { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 25px; }
        .roulette-wrapper-horizontal { position: relative; width: 100%; height: 75px; background: #0f172a; border-radius: 16px; border: 2px solid rgba(255, 255, 255, 0.1); overflow: hidden; }
        .roulette-marker-horizontal { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #ef4444; z-index: 10; box-shadow: 0 0 10px #ef4444; pointer-events: none; }
        .roulette-tape-horizontal { display: flex; align-items: center; position: absolute; left: 0; top: 0; height: 100%; transition: transform 0s cubic-bezier(0.1, 0.8, 0.1, 1); will-change: transform; }
        .slot-item-horizontal { width: 110px; height: 100%; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; border-right: 1px solid rgba(255, 255, 255, 0.05); background: #1e293b; gap: 2px; box-sizing: border-box; }
        .slot-item-horizontal img { width: 24px; height: 24px; object-fit: contain; }
        .item-honey { color: #facc15; } .item-empty { color: #ef4444; } .item-key { color: #38bdf8; background: radial-gradient(circle, rgba(56,189,248,0.08) 0%, #1e293b 100%); }

        .count-selector-box { display: flex; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 4px; gap: 5px; margin-bottom: 20px; }
        .selector-btn { background: transparent; border: none; color: #94a3b8; padding: 8px 25px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .selector-btn.active { background: rgba(255, 255, 255, 0.15); color: #ffffff; }

        .toggles-group-box { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; margin-bottom: 18px; width: 90%; }
        .fast-spin-container { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 15px; font-weight: bold; color: #94a3b8; transition: color 0.2s ease; -webkit-tap-highlight-color: transparent; }
        .fast-spin-container input { display: none; }
        .custom-circle-checkbox { position: relative; width: 22px; height: 22px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; transition: all 0.2s ease; display: inline-block; box-sizing: border-box; flex-shrink: 0; }
        
        #checkboxFastSpin:checked + .custom-circle-checkbox { background: #2563eb; border-color: #2563eb; box-shadow: 0 0 10px rgba(37, 99, 235, 0.5); }
        #checkboxDemoMode:checked + .custom-circle-checkbox { background: #f97316; border-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
        .custom-circle-checkbox::after { content: ""; position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #ffffff; border-radius: 50%; transform: translate(-50%, -50%) scale(0); transition: transform 0.2s ease; }
        .fast-spin-container input:checked + .custom-circle-checkbox::after { transform: translate(-50%, -50%) scale(1); }

        .spin-actions-row { display: flex; gap: 10px; width: 95%; max-width: 340px; }
        .spin-action-btn { flex: 1; color: #ffffff; border: none; padding: 16px 8px; font-size: 16px; font-weight: bold; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform 0.1s ease, background 0.2s; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .btn-honey-type { background: #2563eb; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        .btn-honey-type:active { background: #1d4ed8; transform: scale(0.97); }
        .btn-key-type { background: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-key-type:active { background: #059669; transform: scale(0.97); }
        .spin-action-btn:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; box-shadow: none; }
        .spin-action-btn img { width: 20px; height: 20px; object-fit: contain; }
        .banks-screen-padding { height: 40px; width: 100%; }

        /* СТИЛИ ДЛЯ ИГРЫ С УЛЬЯМИ (МИНЫ) */
        .mines-setup-container { width: 92%; max-width: 360px; background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .game-title { font-size: 22px; font-weight: 800; text-align: center; margin: 0; color: #facc15; }
        .grid-sizes-row { display: flex; gap: 8px; width: 100%; justify-content: center; }
        .size-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #94a3b8; padding: 10px 20px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .size-btn.active { background: #2563eb; color: #ffffff; border-color: #2563eb; }
        .bet-buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        .bet-select-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; color: #ffffff; padding: 12px 6px; font-weight: 800; cursor: pointer; font-size: 14px; transition: transform 0.1s; }
        .bet-select-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }
        .current-bet-display { font-size: 24px; font-weight: 900; color: #ffffff; display: flex; align-items: center; gap: 6px; margin: 5px 0; }
        .slider-holder { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .slider-label { font-size: 14px; color: #94a3b8; display: flex; justify-content: space-between; font-weight: bold; }
        .ylie-slider { width: 100%; accent-color: #facc15; cursor: pointer; }
        .start-game-main-btn { width: 100%; background: #10b981; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 18px; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: all 0.1s; }
        .start-game-main-btn:active { transform: scale(0.97); background: #059669; }
        .start-game-main-btn:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }

        /* ИГРОВОЕ ПОЛЕ МИН */
        .mines-board-container { width: 95%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .game-stats-bar { width: 100%; background: rgba(15, 23, 42, 0.6); padding: 12px 20px; border-radius: 16px; box-sizing: border-box; display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-orange { color: #f97316; } .stat-green { color: #10b981; }
        .mines-grid-display { display: grid; gap: 6px; background: rgba(15, 23, 42, 0.4); padding: 10px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); box-sizing: border-box; width: 100%; aspect-ratio: 1 / 1; }
        .mine-tile { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #64748b; cursor: pointer; transition: all 0.1s ease; aspect-ratio: 1/1; box-sizing: border-box; }
        .mine-tile.opened-safe { background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #10b981; font-size: 24px; cursor: default; }
        .mine-tile.opened-bomb { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; cursor: default; }
        .mine-tile.opened-bomb img { width: 85%; height: 85%; object-fit: contain; animation: shake 0.3s ease-in-out; }
        .mine-tile img { width: 60%; height: 60%; object-fit: contain; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
    </style>
</head>
<body>
    <div class="keys-container">
        <div class="key-slot"><img src="key1.png"><div class="key-count" id="ui-key1">0</div></div>
        <div class="key-slot"><img src="key2.png"><div class="key-count" id="ui-key2">0</div></div>
        <div class="key-slot"><img src="key3.png"><div class="key-count" id="ui-key3">0</div></div>
        <div class="key-slot"><img src="key4.png"><div class="key-count" id="ui-key4">0</div></div>
        <div class="key-slot"><img src="key5.png"><div class="key-count" id="ui-key5">0</div></div>
    </div>
    <div class="balance-container">
        <div class="balance-number" id="ui-balance">12 500</div>
        <img src="honey.png" alt="🍯" class="honey-icon">
    </div>

    <div id="main-screen" class="screen active-screen">
        <div class="buttons-list">
            <button class="menu-btn" onclick="switchScreen('cases-screen')"><img src="case.png" alt="Кейсы"></button>
            <button class="menu-btn" onclick="switchScreen('banks-screen')"><img src="banka.png" alt="Банки"></button>
            <button class="menu-btn" onclick="switchScreen('games-screen')"><img src="igra.png" alt="Игры"></button>
        </div>
    </div>

    <div id="banks-screen" class="screen">
        <div class="back-arrow-btn" onclick="switchScreen('main-screen')">←</div>
        <div class="banks-list">
            <div class="bank-card" onclick="openHorizontalSlots(1)"><img src="banka1.png" class="bank-img"></div>
            <div class="bank-card" onclick="openHorizontalSlots(2)"><img src="banka2.png" class="bank-img"></div>
            <div class="bank-card" onclick="openHorizontalSlots(3)"><img src="banka3.png" class="bank-img"></div>
        </div>
        <div class="banks-screen-padding"></div>
    </div>

    <div id="cases-screen" class="screen">
        <div class="back-arrow-btn" onclick="switchScreen('main-screen')">←</div>
        <div class="cases-list">
            <div class="case-card" onclick="openCaseSlots(1)"><img src="case1.png" class="case-img"></div>
            <div class="case-card" onclick="openCaseSlots(2)"><img src="case2.png" class="case-img"></div>
            <div class="case-card" onclick="openCaseSlots(3)"><img src="case3.png" class="case-img"></div>
            <div class="case-card" onclick="openCaseSlots(4)"><img src="case4.png" class="case-img"></div>
            <div class="case-card" onclick="openCaseSlots(5)"><img src="case5.png" class="case-img"></div>
        </div>
        <div class="banks-screen-padding"></div>
    </div>

    <div id="games-screen" class="screen">
        <div class="back-arrow-btn" onclick="switchScreen('main-screen')">←</div>
        <div class="games-list">
            <div class="game-card" onclick="openMinesSetup()"><img src="igra1.png" class="game-img"></div>
            <div class="game-card" onclick="alert('Игра 2 в разработке!')"><img src="igra2.png" class="game-img"></div>
            <div class="game-card" onclick="alert('Игра 3 в разработке!')"><img src="igra3.png" class="game-img"></div>
        </div>
        <div class="banks-screen-padding"></div>
    </div>

    <div id="mines-setup-screen" class="screen">
        <div class="back-arrow-btn" onclick="switchScreen('games-screen')">←</div>
        <div class="mines-setup-container">
            <h2 class="game-title">РЕЖИМ: УЛЬИ 🐝</h2>
            
            <div class="grid-sizes-row">
                <button class="size-btn" id="size-btn-3" onclick="selectMinesGrid(3)">3x3</button>
                <button class="size-btn" id="size-btn-5" onclick="selectMinesGrid(5)">5x5</button>
                <button class="size-btn active" id="size-btn-7" onclick="selectMinesGrid(7)">7x7</button>
            </div>

            <div class="current-bet-display">
                <span id="minesBetText">100</span> <img src="honey.png" style="width:24px;height:24px;">
            </div>

            <div class="bet-buttons-grid">
                <button class="bet-select-btn" onclick="changeMinesBet(100)">+100</button>
                <button class="bet-select-btn" onclick="changeMinesBet(500)">+500</button>
                <button class="bet-select-btn" onclick="changeMinesBet(2500)">+2500</button>
            </div>

            <div class="slider-holder">
                <div class="slider-label">
                    <span>Количество ульев:</span>
                    <span id="ylieCountLabel">11</span>
                </div>
                <input type="range" min="1" max="48" value="11" class="ylie-slider" id="ylieSlider" oninput="updateYlieSliderLabel()">
            </div>

            <button class="start-game-main-btn" onclick="startMinesGame()">ИГРАТЬ</button>
        </div>
        <div class="banks-screen-padding"></div>
    </div>

    <div id="mines-play-screen" class="screen">
        <div class="mines-board-container">
            <div class="game-stats-bar">
                <div>Множитель: <span class="stat-orange" id="minesCurrentX">x1.00</span></div>
                <div>Банк: <span class="stat-green" id="minesCurrentBankDisplay">100</span> 🍯</div>
            </div>

            <div class="mines-grid-display" id="minesGrid"></div>

            <button class="start-game-main-btn" id="btnMinesCashout" style="background:#2563eb; box-shadow:0 4px 15px rgba(37,99,235,0.3);" onclick="minesCashout()">ЗАБРАТЬ 100 🍯</button>
        </div>
        <div class="banks-screen-padding"></div>
    </div>

    <div id="roulette-screen" class="screen">
        <div class="back-arrow-btn" id="roulette-back-btn" onclick="switchScreen('banks-screen')">←</div>
        <div class="roulette-container-horizontal">
            <div class="count-selector-box">
                <button class="selector-btn active" id="btn-mode-1" onclick="changeLinesCount(1)">1</button>
                <button class="selector-btn" id="btn-mode-2" onclick="changeLinesCount(2)">2</button>
                <button class="selector-btn" id="btn-mode-3" onclick="changeLinesCount(3)">3</button>
            </div>
            <div class="slots-lines-holder" id="slotsHolder"></div>

            <div class="toggles-group-box">
                <label class="fast-spin-container">
                    <input type="checkbox" id="checkboxFastSpin">
                    <span class="custom-circle-checkbox"></span>
                    Быстрая прокрутка
                </label>
                <label class="fast-spin-container">
                    <input type="checkbox" id="checkboxDemoMode">
                    <span class="custom-circle-checkbox"></span>
                    Демо-версия
                </label>
            </div>

            <div class="spin-actions-row">
                <button class="spin-action-btn btn-honey-type" id="btnSpinHoney" onclick="spinHorizontalSlots('honey')">За <span id="spinCostText">700</span> <img src="honey.png"></button>
                <button class="spin-action-btn btn-key-type" id="btnSpinKey" onclick="spinHorizontalSlots('key')">За Ключ <span id="spinKeyText">(1)</span></button>
            </div>
        </div>
        <div class="banks-screen-padding"></div>
    </div>

    <script>
        // ДАННЫЕ ПРИЛОЖЕНИЯ
        let playerData = { honey: 12500, key1: 0, key2: 0, key3: 0, key4: 0, key5: 0 };
        let currentLines = 1, isSpinning = false, currentMode = 'bank', currentBankId = 1, currentCaseId = 1;
        const itemWidth = 110; 
        
        // НАСТРОЙКИ РЕЖИМА "УЛЬИ" (МИНЫ)
        let minesGridSize = 7;
        let minesBet = 100;
        let ylieCount = 11;
        let minesGameState = { active: false, board: [], totalCells: 49, safeCellsOpened: 0, maxSafeCells: 38, winBank: 0, currentMultiplier: 1.0 };

        const bankPools = {
            1: [ { type: 'honey', text: '300', img: 'honey.png' }, { type: 'empty', text: 'Ничего', img: '' }, { type: 'key', text: 'Ключ', img: 'key1.png' } ],
            2: [ { type: 'honey', text: '500', img: 'honey.png' }, { type: 'empty', text: 'Ничего', img: '' }, { type: 'key', text: 'Ключ', img: 'key2.png' }, { type: 'key', text: 'Ключ', img: 'key3.png' } ],
            3: [ { type: 'honey', text: '850', img: 'honey.png' }, { type: 'empty', text: 'Ничего', img: '' }, { type: 'key', text: 'Ключ', img: 'key4.png' }, { type: 'key', text: 'Ключ', img: 'key5.png' } ]
        };

        const bankConfigs = { 1: { price: 300, keyReq: 'key1' }, 2: { price: 500, keyReq: 'key2' }, 3: { price: 700, keyReq: 'key4' } };
        const caseConfigs = { 1: { price: 1000, keyReq: 'key1' }, 2: { price: 1250, keyReq: 'key2' }, 3: { price: 1550, keyReq: 'key3' }, 4: { price: 2000, keyReq: 'key4' }, 5: { price: 4500, keyReq: 'key5' } };

        function updateUI() {
            const elBalance = document.getElementById('ui-balance');
            if (elBalance) elBalance.innerText = playerData.honey.toLocaleString();
            for(let i = 1; i <= 5; i++) {
                const elKey = document.getElementById(`ui-key${i}`);
                if (elKey) elKey.innerText = playerData[`key${i}`];
            }
        }

        // УПРАВЛЕНИЕ НАСТРОЙКАМИ ИГРЫ "УЛЬИ"
        function openMinesSetup() {
            switchScreen('mines-setup-screen');
            selectMinesGrid(7);
            minesBet = 100;
            document.getElementById('minesBetText').innerText = minesBet;
        }

        function selectMinesGrid(size) {
            minesGridSize = size;
            document.getElementById('size-btn-3').classList.remove('active');
            document.getElementById('size-btn-5').classList.remove('active');
            document.getElementById('size-btn-7').classList.remove('active');
            document.getElementById(`size-btn-${size}`).classList.add('active');

            const slider = document.getElementById('ylieSlider');
            const totalCells = size * size;
            slider.max = totalCells - 3; 
            if (parseInt(slider.value) >= totalCells) {
                slider.value = Math.floor(totalCells / 4);
            }
            updateYlieSliderLabel();
        }

        function changeMinesBet(amount) {
            minesBet += amount;
            document.getElementById('minesBetText').innerText = minesBet;
        }

        function updateYlieSliderLabel() {
            ylieCount = parseInt(document.getElementById('ylieSlider').value);
            document.getElementById('ylieCountLabel').innerText = ylieCount;
        }

        // СТАРТ И ЛОГИКА ИГРЫ "УЛЬИ"
        function startMinesGame() {
            const isDemo = document.getElementById('checkboxDemoMode').checked;
            if (!isDemo && playerData.honey < minesBet) {
                alert("Недостаточно мёда для ставки!");
                return;
            }

            if (!isDemo) {
                playerData.honey -= minesBet;
                updateUI();
            }

            // Настройка состояния игры
            minesGameState.active = true;
            minesGameState.totalCells = minesGridSize * minesGridSize;
            minesGameState.safeCellsOpened = 0;
            minesGameState.maxSafeCells = minesGameState.totalCells - ylieCount;
            minesGameState.winBank = minesBet;
            minesGameState.currentMultiplier = 1.0;
            minesGameState.board = Array(minesGameState.totalCells).fill(false); // false = пусто, true = улей

            // Расстановка ульев случайным образом
            let placed = 0;
            while(placed < ylieCount) {
                let idx = Math.floor(Math.random() * minesGameState.totalCells);
                if (!minesGameState.board[idx]) {
                    minesGameState.board[idx] = true;
                    placed++;
                }
            }

            // Отрисовка сетки
            const gridContainer = document.getElementById('minesGrid');
            gridContainer.innerHTML = '';
            gridContainer.style.gridTemplateColumns = `repeat(${minesGridSize}, 1fr)`;

            for(let i = 0; i < minesGameState.totalCells; i++) {
                const tile = document.createElement('div');
                tile.className = 'mine-tile';
                tile.innerText = '?';
                tile.dataset.index = i;
                tile.setAttribute('onclick', `clickMinesTile(${i})`);
                gridContainer.appendChild(tile);
            }

            // Обновление интерфейса матча
            document.getElementById('minesCurrentX').innerText = 'x1.00';
            document.getElementById('minesCurrentBankDisplay').innerText = minesGameState.winBank;
            document.getElementById('btnMinesCashout').innerText = `ЗАБРАТЬ ${minesGameState.winBank} 🍯`;
            document.getElementById('btnMinesCashout').disabled = false;

            switchScreen('mines-play-screen');
        }

        function clickMinesTile(idx) {
            if (!minesGameState.active) return;
            const tile = document.querySelector(`.mine-tile[data-index='${idx}']`);
            if (!tile || tile.classList.contains('opened-safe') || tile.classList.contains('opened-bomb')) return;

            const isDemo = document.getElementById('checkboxDemoMode').checked;
            let isYlie = minesGameState.board[idx];

            // ФИЧА ДЛЯ ДЕМО-РЕЖИМА: Снижаем риск наступить на улей в 2 раза
            if (isDemo && isYlie && Math.random() < 0.5) {
                // Ищем свободное безопасное место и переносим улей туда на лету
                for(let i = 0; i < minesGameState.totalCells; i++) {
                    if (!minesGameState.board[i] && i !== idx) {
                        const targetTile = document.querySelector(`.mine-tile[data-index='${i}']`);
                        if(targetTile && !targetTile.classList.contains('opened-safe')) {
                            minesGameState.board[i] = true;
                            minesGameState.board[idx] = false;
                            isYlie = false;
                            break;
                        }
                    }
                }
            }

            if (isYlie) {
                // НАСТУПИЛ НА УЛЕЙ - ПРОИГРЫШ
                minesGameState.active = false;
                document.getElementById('btnMinesCashout').disabled = true;
                tile.classList.add('opened-bomb');
                tile.innerHTML = '<img src="ylie.png">';

                // Показываем взрыв бомбы (улья) и вскрываем поле
                setTimeout(() => {
                    revealMinesField(false);
                    alert(isDemo ? "Упс! Улей разорен (ДЕМО РЕЖИМ)" : "Упс! Вас искусали пчёлы, ставка сгорела!");
                    switchScreen('mines-setup-screen');
                }, 500);
            } else {
                // БЕЗОПАСНАЯ КЛЕТКА
                minesGameState.safeCellsOpened++;
                tile.classList.add('opened-safe');
                tile.innerHTML = '🪙';

                // Математический расчёт честного коэффициента
                let n = minesGameState.totalCells;
                let m = ylieCount;
                let k = minesGameState.safeCellsOpened;
                
                // Простая и азартная формула мультипликатора
                let mult = 1.0 + (m / (n - k)) * 1.15 * k;
                minesGameState.currentMultiplier = mult;
                minesGameState.winBank = Math.floor(minesBet * mult);

                document.getElementById('minesCurrentX').innerText = 'x' + mult.toFixed(2);
                document.getElementById('minesCurrentBankDisplay').innerText = minesGameState.winBank;
                document.getElementById('btnMinesCashout').innerText = `ЗАБРАТЬ ${minesGameState.winBank} 🍯`;

                // Если открыты абсолютно все чистые клетки
                if (minesGameState.safeCellsOpened === minesGameState.maxSafeCells) {
                    minesCashout();
                }
            }
        }

        function minesCashout() {
            if (!minesGameState.active) return;
            minesGameState.active = false;
            
            const isDemo = document.getElementById('checkboxDemoMode').checked;
            if (!isDemo) {
                playerData.honey += minesGameState.winBank;
                updateUI();
            }

            revealMinesField(true);
            alert(isDemo ? `Забрано ${minesGameState.winBank} 🍯 (ДЕМО)` : `Победа! Вы забрали ${minesGameState.winBank} мёда!`);
            switchScreen('mines-setup-screen');
        }

        function revealMinesField(isWin) {
            for(let i = 0; i < minesGameState.totalCells; i++) {
                const tile = document.querySelector(`.mine-tile[data-index='${i}']`);
                if (!tile) continue;
                
                if (minesGameState.board[i]) {
                    if (!tile.classList.contains('opened-bomb')) {
                        tile.style.background = 'rgba(250, 204, 21, 0.15)';
                        tile.innerHTML = '<img src="ylie.png" style="opacity: 0.6;">';
                    }
                }
            }
        }

        // КОД ДЛЯ КЕЙСОВ И БАНОК (РУЛЕТКА)
        function openHorizontalSlots(bankId) {
            if (isSpinning) return;
            currentMode = 'bank'; currentBankId = bankId;
            const backBtn = document.getElementById('roulette-back-btn');
            if (backBtn) backBtn.setAttribute('onclick', "switchScreen('banks-screen')");
            
            const btnHoney = document.getElementById('btnSpinHoney'); if (btnHoney) btnHoney.style.display = 'flex';
            const keyBtn = document.getElementById('btnSpinKey'); if (keyBtn) keyBtn.style.display = 'none';
            
            switchScreen('roulette-screen'); changeLinesCount(1);
        }

        function openCaseSlots(caseId) {
            if (isSpinning) return;
            currentMode = 'case'; currentCaseId = caseId;
            const backBtn = document.getElementById('roulette-back-btn');
            if (backBtn) backBtn.setAttribute('onclick', "switchScreen('cases-screen')");
            
            const btnHoney = document.getElementById('btnSpinHoney'); if (btnHoney) btnHoney.style.display = 'none';
            
            const keyBtn = document.getElementById('btnSpinKey');
            if (keyBtn) {
                keyBtn.style.display = 'flex';
                keyBtn.innerHTML = `За Ключ <img src="key${caseConfigs[caseId].keyReq.replace('key','')}.png"> <span id="spinKeyText">(${currentLines})</span>`;
            }
            
            switchScreen('roulette-screen'); changeLinesCount(1);
        }

        function changeLinesCount(count) {
            if (isSpinning) return; currentLines = count;
            for(let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`btn-mode-${i}`); if (btn) btn.classList.remove('active');
            }
            const activeBtn = document.getElementById(`btn-mode-${count}`); if (activeBtn) activeBtn.classList.add('active');
            
            let basePrice = currentMode === 'bank' ? bankConfigs[currentBankId].price : caseConfigs[currentCaseId].price;
            
            const txtCost = document.getElementById('spinCostText'); if (txtCost) txtCost.innerText = count * basePrice;
            const txtKey = document.getElementById('spinKeyText'); if (txtKey) txtKey.innerText = "(" + count + ")";
            
            renderRouletteLines();
        }

        function renderRouletteLines() {
            const holder = document.getElementById('slotsHolder'); if (!holder) return;
            holder.innerHTML = '';
            for (let l = 0; l < currentLines; l++) {
                const wrapper = document.createElement('div'); wrapper.className = 'roulette-wrapper-horizontal';
                wrapper.innerHTML = `<div class="roulette-marker-horizontal"></div><div class="roulette-tape-horizontal" id="tape-${l}"></div>`;
                holder.appendChild(wrapper); buildSingleTape(l);
            }
        }

        function getRandomVisualItem() {
            const isDemo = document.getElementById('checkboxDemoMode').checked;
            if (currentMode === 'bank') {
                const activePool = bankPools[currentBankId];
                return activePool[Math.floor(Math.random() * activePool.length)];
            } else {
                let rate = isDemo ? 98 : 90;
                if (currentCaseId === 1) {
                    return Math.random() * 100 < rate 
                        ? { type: 'honey', text: Math.floor(Math.random() * (1350 - 850 + 1)) + 850, img: 'honey.png' }
                        : { type: 'honey', text: '50', img: 'honey.png' };
                } else if (currentCaseId === 2) {
                    let r2 = isDemo ? 98 : 92;
                    return Math.random() * 100 < r2 
                        ? { type: 'honey', text: Math.floor(Math.random() * (1550 - 900 + 1)) + 900, img: 'honey.png' }
                        : { type: 'honey', text: '50', img: 'honey.png' };
                } else if (currentCaseId === 3) {
                    let r3 = isDemo ? 99 : 95;
                    return Math.random() * 100 < r3 
                        ? { type: 'honey', text: Math.floor(Math.random() * (2000 - 1350 + 1)) + 1350, img: 'honey.png' }
                        : { type: 'honey', text: '500', img: 'honey.png' };
                } else if (currentCaseId === 4) {
                    let low = isDemo ? 2500 : 1750;
                    return { type: 'honey', text: Math.floor(Math.random() * (2850 - low + 1)) + low, img: 'honey.png' };
                } else {
                    let low = isDemo ? 5300 : 4250;
                    return { type: 'honey', text: Math.floor(Math.random() * (5750 - low + 1)) + low, img: 'honey.png' };
                }
            }
        }

        function buildSingleTape(lineIndex) {
            const tape = document.getElementById(`tape-${lineIndex}`); if (!tape) return;
            tape.innerHTML = '';
            for (let i = 0; i < 45; i++) createSlotDomItem(tape, getRandomVisualItem());
        }

        function createSlotDomItem(parentTape, itemData) {
            const block = document.createElement('div'); block.className = `slot-item-horizontal item-${itemData.type}`;
            block.innerHTML = itemData.type === 'empty' ? `<span style="font-size:20px; line-height:1;">❌</span><span>${itemData.text}</span>` : `<img src="${itemData.img}"><span>${itemData.text}</span>`;
            parentTape.appendChild(block);
        }

        function spinHorizontalSlots(paymentMethod) {
            if (isSpinning) return;

            let basePrice = currentMode === 'bank' ? bankConfigs[currentBankId].price : caseConfigs[currentCaseId].price;
            let requiredKey = currentMode === 'bank' ? bankConfigs[currentBankId].keyReq : caseConfigs[currentCaseId].keyReq;
            const totalCost = currentLines * basePrice;
            
            const isDemo = document.getElementById('checkboxDemoMode').checked;

            if (!isDemo) {
                if (paymentMethod === 'honey') {
                    if (playerData.honey < totalCost) { alert('Недостаточно мёда!'); return; }
                    playerData.honey -= totalCost;
                } else {
                    if (playerData[requiredKey] < currentLines) { alert('Недостаточно ключей!'); return; }
                    playerData[requiredKey] -= currentLines;
                }
            }

            isSpinning = true; updateUI();
            
            const btnHoney = document.getElementById('btnSpinHoney'); if (btnHoney) btnHoney.disabled = true;
            const btnKey = document.getElementById('btnSpinKey'); if (btnKey) btnKey.disabled = true;
            
            const isFastSpin = document.getElementById('checkboxFastSpin').checked;
            const winIndex = 30; let calculatedResults = [];

            for (let l = 0; l < currentLines; l++) {
                let prize = {}; let rand = Math.random() * 100;
                if (currentMode === 'bank') {
                    if (currentBankId === 1) {
                        if (rand < 40) prize = { type: 'empty', text: 'Ничего', val: 0, img: '' };
                        else if (rand < 99) { let h = Math.floor(Math.random() * 251) + 200; prize = { type: 'honey', text: `${h}`, val: h, img: 'honey.png' }; }
                        else prize = { type: 'key1', text: 'Ключ', val: 1, img: 'key1.png' };
                    } else if (currentBankId === 2) {
                        if (rand < 40) prize = { type: 'empty', text: 'Ничего', val: 0, img: '' };
                        else if (rand < 97) { let h = Math.floor(Math.random() * 301) + 400; prize = { type: 'honey', text: `${h}`, val: h, img: 'honey.png' }; }
                        else if (rand < 99) prize = { type: 'key2', text: 'Ключ', val: 1, img: 'key2.png' };
                        else prize = { type: 'key3', text: 'Ключ', val: 1, img: 'key3.png' };
                    } else {
                        if (rand < 34.5) prize = { type: 'empty', text: 'Ничего', val: 0, img: '' };
                        else if (rand < 98.5) { let h = Math.floor(Math.random() * 301) + 700; prize = { type: 'honey', text: `${h}`, val: h, img: 'honey.png' }; }
                        else if (rand < 99.5) prize = { type: 'key4', text: 'Ключ', val: 1, img: 'key4.png' };
                        else prize = { type: 'key5', text: 'Ключ', val: 1, img: 'key5.png' };
                    }
                } else {
                    let rate1 = isDemo ? 98 : 90;
                    let rate2 = isDemo ? 98 : 92;
                    let rate3 = isDemo ? 99 : 95;

                    if (currentCaseId === 1) {
                        if (rand < rate1) { 
                            let h = Math.floor(Math.random() * (1350 - 850 + 1)) + 850; 
                            prize = { type: 'honey', text: `${h}`, val: h, img: 'honey.png' }; 
                        } else { 
                            prize = { type: 'honey', text: '50', val: 50, img: 'honey.png' }; 
                        }
                    } else if (currentCaseId === 2) {
                        if (rand < rate2) { 
                            let h = Math.floor(Math.random() * (1550 - 900 + 1)) + 900; 
                            prize = { type: 'honey', text: `${h}`, val: h, img: 'honey.png' }; 
                        } else { 
                            prize = { type: 'honey', text: '50', val: 50, img: 'honey.png' }; 
                        }
                    } else if (currentCaseId === 3) {
                        if (rand < rate3) { 
                            let h = Math.floor(Math.random() * (2000 - 1350 + 1)) + 1350; 
                            prize = { type: 'honey', text: `${h}`, val: h, img: 'honey.png' }; 
                        } else { 
                            prize = { type: 'honey', text: '500', val: 500, img: 'honey.png' }; 
                        }
                    } else if (currentCaseId === 4) {
                        let low = isDemo ? 2500 : 1750;
                        let h = Math.floor(Math.random() * (2850 - low + 1)) + low; 
                        prize = { type: 'honey', text: `${h}`, val: h, img: 'honey.png' };
                    } else {
                        let low = isDemo ? 5300 : 4250;
                        let h = Math.floor(Math.random() * (5750 - low + 1)) + low; 
                        prize = { type: 'honey', text: `${h}`, val: h, img: 'honey.png' };
                    }
                }
                calculatedResults.push(prize);

                const tape = document.getElementById(`tape-${l}`); if (!tape) continue;
                tape.style.transition = 'none'; tape.style.transform = 'translateX(0px)'; tape.innerHTML = '';
                
                for (let i = 0; i < 45; i++) {
                    if (i === winIndex) { 
                        let d = {...prize}; if(d.type.startsWith('key')) d.type = 'key'; createSlotDomItem(tape, d); 
                    } else { 
                        createSlotDomItem(tape, getRandomVisualItem()); 
                    }
                }
                const ww = document.querySelector('.roulette-wrapper-horizontal').offsetWidth || 340;
                const stopPos = -((winIndex * itemWidth) + (itemWidth / 2) - (ww / 2)) + (Math.floor(Math.random() * 30) - 15);
                
                if (isFastSpin) {
                    tape.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
                    setTimeout(() => { tape.style.transform = `translateX(${stopPos}px)`; }, 20);
                } else {
                    setTimeout(() => {
                        tape.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
                        tape.style.transform = `translateX(${stopPos}px)`;
                    }, 40);
                }
            }

            if (isFastSpin) {
                setTimeout(() => {
                    isSpinning = false; 
                    if (btnHoney) btnHoney.disabled = false; 
                    if (btnKey) btnKey.disabled = false;
                    
                    if (!isDemo) {
                        calculatedResults.forEach(res => { if (res.type === 'honey') playerData.honey += res.val; else if (playerData[res.type] !== undefined) playerData[res.type] += 1; });
                    }
                    updateUI();
                }, 850); 
            } else {
                setTimeout(() => {
                    isSpinning = false; 
                    if (btnHoney) btnHoney.disabled = false; 
                    if (btnKey) btnKey.disabled = false;
                    
                    if (!isDemo) {
                        calculatedResults.forEach(res => { if (res.type === 'honey') playerData.honey += res.val; else if (playerData[res.type] !== undefined) playerData[res.type] += 1; });
                    }
                    updateUI();
                }, 4100);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUI();
        });
    </script>
</body>
</html>
